.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); gap: 12px; }
.drawer-b { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.drawer-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: .76rem; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: .74rem; color: var(--muted); font-weight: 500; }
.in-ctl { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; }
.in-ctl:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
textarea.in-ctl { resize: vertical; min-height: 64px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.formerr { background: var(--crit-soft); color: var(--crit); padding: 9px 12px; border-radius: 9px; font-size: .84rem; font-weight: 600; }
.note { background: var(--surface-2); border: 1px dashed var(--line-2); padding: 10px 12px; border-radius: 10px; font-size: .82rem; color: var(--ink-2); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--ui); font-size: 11px; font-weight: 600; }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; border-radius: 9px; font-size: .78rem; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.2); z-index: 5; min-width: 150px; max-width: 260px; transform: translate(-50%, calc(-100% - 10px)); line-height: 1.45; }
.tip b { font-weight: 800; }
.tip .tr { display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sankey-link { transition: opacity .15s; }
.sankey-wrap:hover .sankey-link { opacity: .35; }
.sankey-wrap .sankey-link:hover { opacity: .9; }

.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); flex-wrap: wrap; }
.progress { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }

.objgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

.credit-meta > div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.credit-meta .v { font-weight: 800; font-variant-numeric: tabular-nums; }
.statline { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.statline:last-child { border-bottom: 0; }
.statline b { font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.steps > div { background: var(--surface-2); border-radius: 9px; padding: 7px 9px; min-width: 0; }
.steps .v { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .88rem; white-space: nowrap; }
.steps .neg { color: var(--crit); }
.loading { height: 100%; display: grid; place-items: center; color: var(--muted); gap: 10px; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.more-sheet { position: fixed; inset: 0; z-index: 45; background: rgba(6,20,22,.45); display: flex; align-items: flex-end; }
.more-sheet .panel { background: var(--surface); width: 100%; border-radius: 18px 18px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.more-sheet .panel button { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }


/* importar */
.nav button.hl:not(.on) svg { color: var(--sun); }
.dropzone { border: 2px dashed var(--line-2); border-radius: 14px; padding: 30px 18px; text-align: center; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: background .15s, border-color .15s; }
.dropzone.over { border-color: var(--brand); background: var(--brand-soft); }
.dropzone.dis { opacity: .6; }
.dropzone .dz-ico { width: 52px; height: 52px; border-radius: 15px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }

.howto li { display: flex; gap: 11px; align-items: flex-start; }

.reading { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sumrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sumrow > div { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.sumrow .v { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.05rem; white-space: nowrap; }
.in-ctl.need { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.propgroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px 22px; align-items: start; }
.prop { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.prop input { position: absolute; opacity: 0; pointer-events: none; }
.prop .pbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; flex: none; margin-top: 1px; }
.prop.on { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
.prop.on .pbox { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.prop input:focus-visible + .pbox { box-shadow: 0 0 0 3px var(--brand-soft); border-color: var(--brand); }
.prop .pt { display: block; font-weight: 700; font-size: .86rem; line-height: 1.3; }

.mov .i { font-weight: 800; color: var(--out); white-space: nowrap; }

.sel-sm { width: 100%; min-width: 0; padding: 6px 8px; font-size: .8rem; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-family: inherit; }
.sel-sm:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

}

}
