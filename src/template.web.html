<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2a2f">
<meta name="robots" content="noindex, nofollow">
<title>Finanzas García Naranjo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #eef3f2; --surface: #ffffff; --surface-2: #f5f8f7; --surface-3: #eaf0ef;
  --ink: #0f2a2e; --ink-2: #3b5559; --muted: #677d80; --line: #dbe4e2; --line-2: #c7d5d2;
  --brand: #0b6e69; --brand-ink: #ffffff; --brand-soft: #d9eeeb; --brand-2: #09514d;
  --side: #0c2a2f; --side-2: #123a40; --side-ink: #d3e6e2; --side-muted: #8fb1ab; --sun: #f3b63f; --sun-ink: #231a05;
  --in: #0c8467; --in-soft: #dcf2ea; --out: #cc4f35; --out-soft: #fbe6df; --sur: #a86f12; --sur-soft: #fbefd6; --sav: #5847bd; --sav-soft: #e8e5fa;
  --ok: #1a8350; --ok-soft: #dcf1e5; --warn: #9a6400; --warn-soft: #fcefd2; --crit: #c1332c; --crit-soft: #fbe3e1; --info: #2f6e9e; --info-soft: #e0edf7;
  --m1: #0b5f5b; --m2: #1f8f86; --m3: #5fbcb2; --m4: #a9dbd4;
  --s0: #8d9b9d; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --shadow: 0 1px 2px rgba(15,42,46,.06), 0 4px 14px rgba(15,42,46,.05);
  --radius: 14px; --radius-sm: 9px;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --ui: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a1618; --surface: #112225; --surface-2: #15292d; --surface-3: #1a3236;
    --ink: #e3efed; --ink-2: #b4c6c3; --muted: #88a09c; --line: #22393d; --line-2: #2d484c;
    --brand: #3cb3a6; --brand-ink: #062522; --brand-soft: #16393a; --brand-2: #62c9bd;
    --side: #06151a; --side-2: #0f2a30; --side-ink: #cfe3df; --side-muted: #7fa29c;
    --in: #37c29a; --in-soft: #10352d; --out: #f07c62; --out-soft: #3a1f19; --sur: #e2a646; --sur-soft: #372912; --sav: #9e90f2; --sav-soft: #24204a;
    --ok: #46c483; --ok-soft: #123324; --warn: #e3ac3c; --warn-soft: #362810; --crit: #f0776f; --crit-soft: #3c1b19; --info: #7cb6e6; --info-soft: #14283a;
    --m1: #9ee0d7; --m2: #4fbfb2; --m3: #268d83; --m4: #175e58;
    --s0: #7e8e90; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a1618; --surface: #112225; --surface-2: #15292d; --surface-3: #1a3236;
  --ink: #e3efed; --ink-2: #b4c6c3; --muted: #88a09c; --line: #22393d; --line-2: #2d484c;
  --brand: #3cb3a6; --brand-ink: #062522; --brand-soft: #16393a; --brand-2: #62c9bd;
  --side: #06151a; --side-2: #0f2a30; --side-ink: #cfe3df; --side-muted: #7fa29c;
  --in: #37c29a; --in-soft: #10352d; --out: #f07c62; --out-soft: #3a1f19; --sur: #e2a646; --sur-soft: #372912; --sav: #9e90f2; --sav-soft: #24204a;
  --ok: #46c483; --ok-soft: #123324; --warn: #e3ac3c; --warn-soft: #362810; --crit: #f0776f; --crit-soft: #3c1b19; --info: #7cb6e6; --info-soft: #14283a;
  --m1: #9ee0d7; --m2: #4fbfb2; --m3: #268d83; --m4: #175e58;
    --s0: #7e8e90; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.85rem; font-weight: 700; line-height: 1.15; }
h2 { font-size: 1.12rem; font-weight: 650; line-height: 1.25; }
h3 { font-size: .98rem; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
#root { height: 100%; }
.shell { display: grid; grid-template-columns: 266px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 22px; padding: 22px 16px 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; font: 800 1.02rem/1 var(--display); letter-spacing: -.03em; flex: none; }
.brand-name { font: 700 1.12rem/1.1 var(--display); color: #fff; }
.brand-sub { font-size: .74rem; color: var(--side-muted); }
.monthbox { background: var(--side-2); border-radius: 12px; padding: 10px 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.monthbox .row { display: flex; align-items: center; justify-content: space-between; }
.monthbox .mlabel { font: 700 .98rem/1.2 var(--display); color: #fff; text-align: center; white-space: nowrap; }
.monthbox .icon-btn { width: 30px; height: 30px; }
.icon-btn { background: transparent; border: 0; border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; color: inherit; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.main .icon-btn:hover { background: var(--surface-3); }
.chipnav { display: flex; gap: 6px; justify-content: center; }
.chipnav button { border: 0; background: transparent; color: var(--side-muted); font-size: .76rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chipnav button.on { background: rgba(243,182,63,.16); color: var(--sun); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: var(--side-ink); padding: 9px 12px; border-radius: 10px; font-weight: 600; text-align: left; }
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button.on { background: var(--sun); color: var(--sun-ink); }
.nav button.on svg { color: var(--sun-ink); }
.nav svg { color: var(--side-muted); flex: none; }
.nav .badge { margin-left: auto; background: rgba(255,255,255,.12); color: #fff; font-size: .7rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; }
.nav button.on .badge { background: rgba(0,0,0,.12); color: var(--sun-ink); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.savestate { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--side-muted); padding: 0 8px; }
.savestate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--side-muted); flex: none; }
.savestate.ok .dot { background: #45c486; }
.savestate.busy .dot { background: var(--sun); }
.savestate.err { color: #ffb4ab; }
.savestate.err .dot { background: #ff7a6e; }
.side-btn { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: var(--side-ink); padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: .84rem; }
.side-btn:hover { background: rgba(255,255,255,.06); }

.main { overflow-y: auto; min-width: 0; }
.page { max-width: 1320px; margin: 0 auto; padding-block: 26px 48px; padding-inline: 32px; display: flex; flex-direction: column; gap: 22px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pagehead .lead { color: var(--ink-2); max-width: 62ch; margin-top: 4px; }
.topbar, .tabbar { display: none; }

/* ---------- grid & cards ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: 1 / -1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head { flex-wrap: wrap; }
.card-head > .grow { flex: 1 1 220px; }
.card-head .sub { color: var(--muted); font-size: .82rem; margin-top: 2px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.right { text-align: right; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.kpi { border-radius: var(--radius); padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; min-width: 0; }
.kpi .k-top { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .84rem; }
.kpi .k-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.kpi .k-val { font: 700 1.75rem/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.kpi .k-foot { font-size: .8rem; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi.in { background: var(--in-soft); } .kpi.in .k-ico { background: var(--in); } .kpi.in .k-top { color: var(--in); }
.kpi.out { background: var(--out-soft); } .kpi.out .k-ico { background: var(--out); } .kpi.out .k-top { color: var(--out); }
.kpi.sur { background: var(--sur-soft); } .kpi.sur .k-ico { background: var(--sur); } .kpi.sur .k-top { color: var(--sur); }
.kpi.sav { background: var(--sav-soft); } .kpi.sav .k-ico { background: var(--sav); } .kpi.sav .k-top { color: var(--sav); }
.kpi.neutral { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); } .kpi.neutral .k-ico { background: var(--brand); } .kpi.neutral .k-top { color: var(--brand); }
.delta { font-weight: 700; font-size: .76rem; padding: 1px 7px; border-radius: 999px; background: rgba(0,0,0,.05); }
.delta.up { color: var(--ok); } .delta.down { color: var(--crit); }

/* pills, chips, badges */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--info-soft); color: var(--info); } .pill.neutral { background: var(--surface-3); color: var(--ink-2); } .pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.sav { background: var(--sav-soft); color: var(--sav); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: .82rem; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .86rem; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-2); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.btn.danger.solid { background: var(--crit); color: #fff; border-color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand); padding-inline: 8px; }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.sm { padding: 5px 10px; font-size: .78rem; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }

/* alerts */
.alerts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.alert { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.alert .a-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.alert.critico .a-ico { background: var(--crit-soft); color: var(--crit); }
.alert.aviso .a-ico { background: var(--warn-soft); color: var(--warn); }
.alert.info .a-ico { background: var(--info-soft); color: var(--info); }
.alert .a-t { font-weight: 700; font-size: .88rem; line-height: 1.3; }
.alert .a-x { color: var(--ink-2); font-size: .8rem; margin-top: 2px; }
.alert.critico { border-color: color-mix(in srgb, var(--crit) 30%, var(--line)); }

/* bars & lists */
.bar { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.bar > span { display: block; height: 100%; border-radius: 999px; }
.bar.tall { height: 16px; border-radius: 6px; }
.bar.tall > span { border-radius: 4px; }
.arealist { display: flex; flex-direction: column; gap: 4px; }
.arearow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 0; background: transparent; text-align: left; width: 100%; }
.arearow:hover { background: var(--surface-2); }
.arearow .nm { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .88rem; min-width: 0; }
.arearow .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arearow .vl { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .9rem; }
.arearow .vl small { color: var(--muted); font-weight: 600; margin-left: 6px; }
.arearow .bar { grid-column: 1 / -1; height: 7px; }
.subrows { padding: 2px 10px 8px 28px; display: flex; flex-direction: column; gap: 6px; }
.subrow { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; }
.subrow .items { color: var(--muted); font-size: .76rem; }

/* tables */
.tablewrap { overflow-x: auto; border-radius: 10px; }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.t th { text-align: left; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td:first-child { white-space: nowrap; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t tr.tot td { font-weight: 800; background: var(--surface-2); }
table.t .proj { color: var(--muted); font-style: italic; }

/* month lines (Mes) */
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.moment { display: flex; flex-direction: column; gap: 10px; }
.moment-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 4px; }
.moment-h .mt { font: 700 1rem/1.2 var(--display); }
.moment-h .md { font-size: .76rem; color: var(--muted); }
.line { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 10px; }
.line .rail { align-self: stretch; border-radius: 4px; }
.line .ln { font-weight: 700; font-size: .87rem; line-height: 1.3; }
.line .lm { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.line .lv { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.amt { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .92rem; border: 0; background: transparent; padding: 2px 6px; border-radius: 7px; color: var(--ink); margin-left: -6px; }
.amt:hover { background: var(--surface-3); }
.line .amt { margin-left: 0; }
.amt.v { font-size: .92rem; padding: 0 4px; margin-left: -4px; }
.line.in .amt { color: var(--in); }
.line.done { background: var(--surface-2); }
.line .est { font-size: .72rem; color: var(--muted); }
.amtinput { width: 104px; text-align: right; font-weight: 800; padding: 5px 8px; border-radius: 8px; border: 1.5px solid var(--brand); background: var(--surface); font-variant-numeric: tabular-nums; }
.check { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: transparent; flex: none; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check:hover { border-color: var(--ok); }

/* forms */
.drawer-bg { position: fixed; inset: 0; background: rgba(6,20,22,.45); z-index: 40; display: flex; justify-content: flex-end; }
.drawer { width: min(460px, 100%); height: 100%; background: var(--surface); box-shadow: -8px 0 30px rgba(0,0,0,.18); display: flex; flex-direction: column; animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); gap: 12px; }
.drawer-b { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.drawer-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: .76rem; font-weight: 700; color: var(--ink-2); }
.field .hint { font-size: .74rem; color: var(--muted); font-weight: 500; }
.in-ctl { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; }
.in-ctl:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
textarea.in-ctl { resize: vertical; min-height: 64px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.formerr { background: var(--crit-soft); color: var(--crit); padding: 9px 12px; border-radius: 9px; font-size: .84rem; font-weight: 600; }
.note { background: var(--surface-2); border: 1px dashed var(--line-2); padding: 10px 12px; border-radius: 10px; font-size: .82rem; color: var(--ink-2); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--ui); font-size: 11px; font-weight: 600; }
.chart .gridline { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; }
